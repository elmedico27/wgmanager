# Test everything, then build the container image for amd64 and arm64.
# One build, pushed to two registries with identical tags and digest:
#   ghcr.io/<owner>/wgmanager and docker.io/<owner>/wgmanager
#   push to master  -> :edge                             (+ :sha-xxxxxxx)
#   tag vX.Y.Z      -> :X.Y.Z, :X.Y and :latest          (+ :sha-xxxxxxx)
#   pull request    -> tests and a build, nothing published
# Docker Hub needs the secret DOCKERHUB_TOKEN (read & write access token); the
# Docker Hub username must equal the GitHub owner name.
# Actions are pinned to full commit SHAs (a tag can be moved; a commit cannot).
# Versions chosen 2026-10-22, each at least 14 days old; Dependabot proposes updates.
name: build

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Host tool and helper tests (Python)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s host/tests

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Build the UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Backend tests, including SSH against a throwaway local sshd
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo sh test/ssh-lab.sh /tmp/wgm-lab
          sudo env "PATH=$PATH" WGM_SSH_LAB=/tmp/wgm-lab npm test

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ github.repository_owner }}/wgmanager
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build (and push, except for pull requests)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
