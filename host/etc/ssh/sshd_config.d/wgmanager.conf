# Install as /etc/ssh/sshd_config.d/wgmanager.conf, owner root, mode 0644.
# Validate BEFORE reloading sshd:  sshd -t
# Then confirm the effective settings:  sshd -T -C user=wgweb,host=x,addr=<container ip>
Match User wgweb
    AuthorizedKeysFile /etc/wgmanager/authorized_keys
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthenticationMethods publickey
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowTcpForwarding no
    PermitTunnel no
    DisableForwarding yes
    ForceCommand sudo -n /usr/local/sbin/wgmanager-helper --ssh
